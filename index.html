/* Halifax–Dartmouth live weather section */
.weather-section{
  flex-shrink:0;margin-top:1.2vh;padding:1.25vh 2.2vw 1.15vh;border-radius:18px;
  background:rgba(3,29,48,.82);border:1px solid rgba(255,255,255,.20);
  box-shadow:0 7px 24px rgba(0,0,0,.20)
}
.weather-title{text-align:center;font-size:clamp(20px,2.35vh,31px);font-weight:800;
  letter-spacing:1.5px;text-transform:uppercase}
.weather-current{display:grid;grid-template-columns:.8fr 1.35fr 1.15fr;align-items:center;
  gap:1.5vw;margin-top:.65vh}
.weather-temp{font-size:clamp(42px,5.4vh,70px);font-weight:800;line-height:1}
.weather-condition{font-size:clamp(20px,2.45vh,31px);font-weight:700}
.weather-feels{font-size:clamp(14px,1.55vh,20px);color:#c7effb;margin-top:.2vh}
.weather-details{text-align:right;font-size:clamp(14px,1.55vh,20px);line-height:1.35}
.forecast-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1vw;margin-top:.8vh}
.forecast-card{padding:.65vh .8vw;border-radius:11px;background:rgba(255,255,255,.075);
  text-align:center;border:1px solid rgba(255,255,255,.10)}
.forecast-period{font-size:clamp(12px,1.35vh,17px);font-weight:800;text-transform:uppercase}
.forecast-summary{margin-top:.15vh;font-size:clamp(11px,1.2vh,16px);line-height:1.18}
.weather-source{text-align:center;margin-top:.55vh;font-size:clamp(10px,1.05vh,14px);color:#a9d7e7}
.weather-error{text-align:center;color:#ffd084;font-size:clamp(13px,1.4vh,18px)}
/* Make room for weather while preserving the existing portrait design */
.board{padding-top:2.1vh;padding-bottom:1.25vh}
.flag{width:clamp(72px,9vw,108px);margin-bottom:.45vh}
.location{font-size:clamp(14px,1.55vh,22px)}
.header h1{font-size:clamp(40px,4.8vh,66px)}
.subtitle{margin-top:.45vh;font-size:clamp(15px,1.7vh,23px)}
.next-section{margin-top:1.25vh;padding:1.15vh 3vw;border-radius:20px}
.next-label{font-size:clamp(16px,1.75vh,24px)}
.next-type{margin-top:.25vh;font-size:clamp(29px,3.45vh,47px)}
.next-time{margin-top:.15vh;font-size:clamp(45px,5.15vh,70px)}
.next-height{margin-top:.35vh;font-size:clamp(18px,2vh,27px)}
.ocean-band{height:5.2vh;min-height:42px;margin:.65vh 0}
.upcoming-title{margin-top:.65vh;margin-bottom:.45vh;font-size:clamp(17px,1.9vh,25px)}
.tides{gap:.42vh;flex:0 0 auto}
.tide-row{padding:.62vh 3vw;border-radius:12px}
.tide-type{font-size:clamp(17px,1.85vh,25px)}
.tide-time{font-size:clamp(18px,2vh,27px)}
.tide-height{font-size:clamp(16px,1.7vh,23px)}
.footer{padding-top:.55vh;font-size:clamp(10px,1.05vh,14px)}

ES</h1><div class="subtitle">Atlantic Tide Information</div></header><section class="next-section"><div class="next-label">Next Tide</div><div id="nextType" class="next-type">Loading…</div><div id="nextTime" class="next-time">--:--</div><div id="nextHeight" class="next-height">--</div></section><div class="ocean-band" aria-label="Nova Scotia Atlantic coastline"></div><div class="upcoming-title">Upcoming Tides</div><div id="tideList" class="tides"></div>

const DATA_FILE="tides.json";function formatTime(v){if(!v)return"--";return v.replace("am"," AM").replace("pm"," PM").toUpperCase()}function timeToMinutes(v){const m=v.match(/(\d{1,2}):(\d{2})(am|pm)/i);if(!m)return null;let h=parseInt(m[1]),n=parseInt(m[2]),p=m[3].toLowerCase();if(p==="pm"&&h!==12)h+=12;if(p==="am"&&h===12)h=0;return h*60+n}function findNextTide(t){const n=new Date(),c=n.getHours()*60+n.getMinutes();for(const x of t){const m=timeToMinutes(x.time);if(m!==null&&m>=c)return x}return t[0]}function displayTides(d){const t=d.tides||[];if(!t.length)throw new Error("No tide information available.");const n=findNextTide(t);document.getElementById("nextType").textContent=n.type+" Tide";document.getElementById("nextTime").textContent=formatTime(n.time);document.getElementById("nextHeight").textContent=n.height_m.toFixed(2)+" metres";const i=t.indexOf(n);let u=t.slice(i+1,i+6);if(u.length<5)u=u.concat(t.slice(0,5-u.length));const l=document.getElementById("tideList");l.innerHTML="";u.forEach(x=>{const r=document.createElement("div");r.className="tide-row";r.innerHTML=`<div class="tide-type">${x.type}</div><div class="tide-time">${formatTime(x.time)}</div><div class="tide-height">${x.height_m.toFixed(2)} m</div>`;l.appendChild(r)});const z=new Date(d.updated_utc);document.getElementById("status").textContent="Last data update: "+z.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}async function loadTides(){try{const r=await fetch(DATA_FILE+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Unable to load tide data.");displayTides(await r.json())}catch(e){console.error(e);document.getElementById("status").textContent="Tide data temporarily unavailable"}}loadTides();setInterval(loadTides,5*60*1000);

const WEATHER_FILE="weather.json";

function enValue(obj,fallback="--"){
  if(obj===null||obj===undefined)return fallback;
  if(typeof obj==="string"||typeof obj==="number")return obj;
  if(obj.en!==undefined&&obj.en!==null)return obj.en;
  if(obj.value!==undefined)return enValue(obj.value,fallback);
  return fallback;
}
function weatherNumber(obj){
  const v=enValue(obj,null);
  const n=Number(v);
  return Number.isFinite(n)?n:null;
}
function forecastText(f){
  const abbr=enValue(f?.abbreviatedForecast?.textSummary,"");
  const text=enValue(f?.textSummary,"");
  const vis=enValue(f?.visibility?.textSummary,"");
  return abbr||text||vis||"Forecast available";
}
function forecastTemperature(f){
  const a=f?.temperatures?.temperature;
  if(!Array.isArray(a)||!a.length)return "";
  const t=a.find(x=>weatherNumber(x)!==null)||a[0];
  const v=weatherNumber(t);
  return v===null?"":Math.round(v)+"°";
}
function displayWeather(d){
  const w=d.weather||{};
  const c=w.currentConditions||{};
  const temp=weatherNumber(c.temperature);
  const chill=weatherNumber(c.windChill);
  const humid=weatherNumber(c.relativeHumidity);
  const speed=weatherNumber(c.wind?.speed);
  const gust=weatherNumber(c.wind?.gust);
  const dir=enValue(c.wind?.direction,"");
  const condition=enValue(c.condition,"Current conditions");
  const station=enValue(c.station,"");
  const forecasts=Array.isArray(w.forecastGroup?.forecasts)?w.forecastGroup.forecasts.slice(0,3):[];

  const feels=(chill!==null && temp!==null && chill<temp)
    ? `Feels like ${Math.round(chill)}°C`
    : "";

  const wind=(dir||speed!==null)
    ? `${dir}${dir&&speed!==null?" ":""}${speed!==null?Math.round(speed)+" km/h":""}${gust!==null?" • Gust "+Math.round(gust):""}`
    : "--";

  const cards=forecasts.map(f=>{
    const period=enValue(f?.period?.textForecastName,enValue(f?.period,"Forecast"));
    const ft=forecastTemperature(f);
    const summary=forecastText(f);
    return `<div class="forecast-card"><div class="forecast-period">${period}${ft?" • "+ft:""}</div><div class="forecast-summary">${summary}</div></div>`;
  }).join("");

  document.getElementById("weatherContent").innerHTML=`
    <div class="weather-current">
      <div class="weather-temp">${temp!==null?temp.toFixed(1)+"°C":"--"}</div>
      <div><div class="weather-condition">${condition}</div><div class="weather-feels">${feels}</div></div>
      <div class="weather-details"><div>Wind: ${wind}</div><div>Humidity: ${humid!==null?Math.round(humid)+"%":"--"}</div></div>
    </div>
    ${cards?`<div class="forecast-row">${cards}</div>`:""}
    <div class="weather-source">Environment and Climate Change Canada${station?" • "+station:""}</div>`;
}
async function loadWeather(){
  try{
    const r=await fetch(WEATHER_FILE+"?v="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("Unable to load weather data.");
    displayWeather(await r.json());
  }catch(e){
    console.error(e);
    document.getElementById("weatherContent").innerHTML=
      '<div class="weather-error">Weather data temporarily unavailable</div>';
  }
}
loadWeather();
setInterval(loadWeather,5*60*1000);
