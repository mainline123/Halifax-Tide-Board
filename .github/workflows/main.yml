name: Update Halifax Tide Board

on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write

jobs:
  update-tides:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update tide data
        run: python update-tides.py

      - name: Commit updated tide data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tides.json
          if git diff --cached --quiet; then
            echo "No tide changes to commit"
          else
            git commit -m "Update Halifax tide data"
            git push
          fi
